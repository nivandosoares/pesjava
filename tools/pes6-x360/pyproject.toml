[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pes6-x360-cli"
version = "0.1.0"
description = "Inspect and patch club names and crests in PES 6 for Xbox 360"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.scripts]
pes6-x360 = "pes6_x360.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pes6_x360 = ["clubes.tsv"]
